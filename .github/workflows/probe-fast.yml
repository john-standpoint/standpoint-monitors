name: Probe · fast (best-effort, ~hourly in practice)

# The visitor-facing tier. Runs PAGE checks only — is the live build being
# served, can the booking calendar be drawn, is the Scan's database reachable.
# Warnings are deliberately NOT run here; they belong to the daily suite, so a
# config drift produces one red run a day rather than ninety-six.
#
# ⚠⚠ THE CRON BELOW ASKS FOR EVERY 15 MINUTES. GITHUB DOES NOT DELIVER IT, AND
# THIS WORKFLOW IS NAMED FOR WHAT HAPPENS RATHER THAN WHAT IS REQUESTED.
#
# Measured over the first night, 2026-08-16/17, from the dead-man's switch's own
# ping log — gaps between consecutive successful runs, in minutes:
#
#     20, 10, 27, 21, 11, 109, 59, 47, 47, 50, 41
#     median 41 · worst 109 · and degrading (first five avg 18, last six avg 59)
#
# None of those runs landed on the requested slots. GitHub documents the
# `schedule` event as best-effort, delayed under load and skipped entirely when
# busy; a */15 cron behaves like an hourly one in practice.
#
# ⚠ THE SLOTS ARE KEPT ANYWAY, DELIBERATELY. Asking for four an hour and being
# given one is strictly better than asking for one: on quiet nights GitHub does
# deliver several. What was corrected is the CLAIM, not the request. If a future
# reader "fixes" this to an honest hourly cron, they will lose the extra runs and
# gain nothing.
#
# ⚠⚠ AND THE DEAD-MAN'S SWITCH MUST BE SIZED FROM THE MAXIMUM OF THAT
# MEASUREMENT, NOT FROM THIS CRON AND NOT FROM ITS MEDIAN. It is set to period
# 60 / grace 90 at healthchecks.io — a 150-minute tolerance. It took two wrong
# answers to get there, and the second is the instructive one:
#
#   period 15 / grace 20   35 min   EIGHT false alarms in one night
#   period 60 / grace 30   90 min   one false alarm, on a 98-minute gap
#   period 60 / grace 90  150 min   0 breaches over 31 gaps, ~37% headroom
#
# The first was sized from the cron this file ASKS for. The second was sized the
# morning after the measurement above — from a dataset whose MAXIMUM WAS 109
# MINUTES, to a threshold of 90. Set below a number sitting in the very data
# used to justify it. "Size it from the measurement" is not satisfied by having
# taken a measurement.
#
# ⚠ The costs are not comparable, which is why the threshold sits well above the
# maximum rather than near it. A false alarm costs trust in every alert this
# system will ever send — the exact alert-fatigue failure checks.mjs argues
# against, manufactured inside the tool built to prevent it. A late alarm costs
# an extra hour of not knowing that the MONITOR has stopped; the site itself
# keeps mailing on every run that happens.
#
# ⚠ THE 15-MINUTE CADENCE IS FREE ONLY BECAUSE THIS REPOSITORY IS PUBLIC.
# GitHub bills Actions in whole minutes per job, so this workflow alone is
# ~2,880 minutes a month — above the 2,000-minute free tier for a private
# repository. If this repo is ever made private, this cron MUST come down to
# hourly or the bill arrives silently. Nothing here can detect that for you.
#
# ⚠ GITHUB DISABLES SCHEDULED WORKFLOWS AFTER 60 DAYS OF REPOSITORY INACTIVITY.
# That is a silent death: no run, no failure, no mail, and a monitoring system
# that has stopped monitoring looks exactly like one with nothing to report.
# The dead-man's switch below is the only thing that catches it — which is why
# --deadman is passed here, on the most frequent suite, and why a missing
# DEADMAN_URL_FAST is a hard failure rather than a skipped step.
#
# ---------------------------------------------------------------------------
# ⚠⚠ 2026-08-31 — THE MEASUREMENT ABOVE NO LONGER DESCRIBES GITHUB. READ ON
# BEFORE SIZING ANYTHING FROM IT.
#
# The 2026-08-16/17 numbers (median 41, worst 109) held for ten days and were
# re-confirmed over 21–25 Aug: median 34, worst 114, ZERO breaches of the
# 150-minute tolerance across ~160 gaps. The 150 was sized correctly and is not
# the defect.
#
# Then delivery broke, and has not recovered:
#
#     21–25 Aug   median  34 min   max 114     0 breaches
#     28–31 Aug   median 221 min   max 719    12 of 16 gaps breach
#
# ⚠ NOTHING IN THIS REPOSITORY FAILED. 401 runs, 401 pings, every one green.
# A manual workflow_dispatch during the worst of it started IMMEDIATELY and went
# green in 16 s. GitHub accepts the schedule event and delivers it hours late.
# Not the branch, not a filter, not the 60-day disable, not billing, not the
# checks, not the runners — all excluded by that one manual run.
#
# ⚠ DO NOT WIDEN period/grace TO COVER 719 MINUTES. A ~12-hour tolerance cannot
# detect a dead probe within a working day, which is the switch's entire job.
# Sizing from the maximum is right; sizing from an OUTAGE's maximum is not.
# Re-measure over a settled week before touching it.
#
# ⚠⚠ AND THE THING A FUTURE READER MUST NOT INFER FROM A GREEN SWITCH:
# SINCE 2026-08-31 THIS SUITE IS ALSO TRIGGERED FROM OUTSIDE GITHUB — an hourly
# cron-job.org job (id 8357337, `45 * * * *`) POSTing to this workflow's
# `dispatches` endpoint with a fine-grained PAT. The probe still RUNS here on
# purpose: triggering it from the host that serves the sites would probe them
# from inside their own network and stop seeing DNS and edge failures.
#
# The consequence is deliberate and easy to miss: THE DEAD-MAN'S SWITCH NOW
# MEASURES cron-job.org, NOT GITHUB'S SCHEDULER. A green switch no longer means
# the cron below is being delivered — the probe is kept alive either way. That
# is the point, and it also retires the instrument that detected this outage.
# If you want to know whether GitHub's scheduler is healthy, read the run list
# and look at the `Scheduled` events; the switch will not tell you.
#
# ⚠ The external trigger's PAT expires 2027-01-14. Its death is self-catching —
# the system falls back to the degraded cron and the switch fires, late and
# noisy — but it will look like a GitHub problem, not a token problem.

on:
  schedule:
    # Offset from the top of the hour on purpose: GitHub's scheduler is
    # congested at :00 and delays runs, which would show up as jitter in the
    # timing samples this suite is quietly collecting.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# Read-only. This workflow has no business touching the repository, and a
# monitor that could write to things is a monitor that can break them.
permissions:
  contents: read

# A slow run must never have a second run pile up behind it. `cancel-in-progress`
# is false: cancelling the older run would lose the sample it was taking.
concurrency:
  group: probe-fast
  cancel-in-progress: false

jobs:
  probe:
    name: Page-level checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No `npm ci`. There are no dependencies, deliberately — see README.
      # A monitor that can be broken by a supply-chain update is a monitor
      # that will be broken on the morning you need it.
      # ⚠ --alert is on EVERY suite, unlike --deadman. They answer different
      # questions and the distinction matters: --deadman asks "is the probe still
      # running at all", which exactly one suite may answer. --alert carries the
      # DIAGNOSIS of whatever this suite just found, and a suite whose findings
      # cannot reach an inbox is a suite nobody hears from.
      - name: Run the fast probe
        env:
          # ⚠ BOTH are passed on purpose, and this suite is the ONLY place that
          # is true. DEADMAN_URL_FAST is the name going forward; the bare
          # DEADMAN_URL is the secret that already exists and keeps working —
          # probe.mjs falls back to it for the `fast` suite alone. An unset
          # secret renders as an empty string, which is falsy, so the fallback
          # engages by itself and NO SECRET HAS TO BE TOUCHED FOR THIS TO SHIP.
          # ⚠ Do NOT copy this pair into another workflow: the whole reason the
          # fallback is scoped to `fast` is that a daily run pinging the fast
          # switch would keep it green while the fast probe was dead.
          DEADMAN_URL_FAST: ${{ secrets.DEADMAN_URL_FAST }}
          DEADMAN_URL: ${{ secrets.DEADMAN_URL }}
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
        run: node probe.mjs --suite fast --deadman --alert
