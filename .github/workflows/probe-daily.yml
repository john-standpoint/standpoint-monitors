name: Probe · daily (page + warnings)

# The tier that catches the failures nobody was on the other end of.
#
# This suite adds the WARNING checks the fast probe filters out — the ones that
# answer HTTP 200 while something is quietly wrong:
#
#   register != on        the audit registry state that ran broken for 19 days
#   ticket   != enforce   B-07 unbound, i.e. submissions trusted again
#   stale    == true      a booking cache that could not be refreshed
#   robots.txt            the AI crawler policy losing named agents
#
# ⚠ A WARNING TURNS THIS RUN RED, AND THAT IS THE DESIGN. The tempting
# alternative — print the warning and exit 0 — recreates the exact failure this
# whole repository was built after: the registry's 401s were non-blocking by
# design, correct by design, reported to one line of chat, and then nowhere.
# One red run a day is loud enough to act on and quiet enough not to mute.

on:
  schedule:
    # 06:07 UTC — early morning in Zurich, so a red run is sitting in the inbox
    # at the start of the day rather than competing with it.
    - cron: "7 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-daily
  cancel-in-progress: false

jobs:
  probe:
    name: Page-level checks and warnings
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # ⚠⚠ --deadman IS HERE AS OF 2026-08-31, AND THE OLD COMMENT SAYING IT MUST
      # NOT BE WAS RIGHT ABOUT THE HAZARD AND WRONG ABOUT THE REMEDY.
      #
      # What it said: liveness belongs to exactly one suite, because a daily run
      # could otherwise keep the switch looking healthy while the fast probe had
      # silently stopped. That hazard is real and has not gone away.
      #
      # ⚠ But it forbids TWO SUITES SHARING ONE SWITCH. It does not forbid two
      # switches. Sharing lets either suite mask the other; one switch each lets
      # neither. The original wording collapsed those into a single prohibition
      # and cost the daily suite any liveness signal at all.
      #
      # ⚠⚠ WHAT THAT COST, MEASURED: when GitHub's scheduler degraded on 26 Aug
      # 2026, this suite ran between 5 h 42 m and 12 h 29 m LATE on five
      # consecutive days, and NOTHING ANYWHERE REPORTED IT. A suite that does not
      # run produces no red run, no mail and no missing ping — LATE, HEALTHY and
      # DEAD are the same observation from outside. It surfaced only because the
      # FAST probe's switch was noisy enough that John went looking.
      #
      # ⚠ DEADMAN_URL_DAILY must be its OWN healthchecks check, never the fast
      # one's URL. probe.mjs enforces this: the legacy DEADMAN_URL falls back for
      # the `fast` suite ALONE and is rejected here, precisely so a copied secret
      # cannot recreate the masking bug this comment is about.
      #
      # ⚠ Size its grace from MEASURED lateness, not from the cron. Delivery has
      # been hours late for days; a 30-minute grace would page every morning and
      # be muted within a week.
      #
      # ⚠ --alert is separate and unchanged. Liveness belongs to one suite; the
      # diagnosis belongs to whichever suite found it. The daily suite is the only
      # one reporting warnings at all, so without --alert the entire warn tier —
      # `ticket: off`, `register: admin-only`, the two states that cost 19 days
      # once — would never reach an inbox with its text attached.
      - name: Run the daily probe
        env:
          DEADMAN_URL_DAILY: ${{ secrets.DEADMAN_URL_DAILY }}
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
        run: node probe.mjs --suite daily --deadman --alert
